plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 34

    defaultConfig {
        // own id so it installs next to the original FFShare instead of clashing with it
        applicationId "com.caydey.ffshare.plus"
        minSdk 26
        targetSdk 34
        versionCode 23
        versionName "2.0.0-plus"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    // release key from ~/.gradle/gradle.properties when present, otherwise the debug key so builds still work
    def hasReleaseKey = project.hasProperty('FFSHARE_RELEASE_STORE_FILE')
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(FFSHARE_RELEASE_STORE_FILE)
                storePassword FFSHARE_RELEASE_STORE_PASSWORD
                keyAlias FFSHARE_RELEASE_KEY_ALIAS
                keyPassword FFSHARE_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            ndk {
                // ffmpeg is only built for 64-bit arm (every recent phone), see build_ffmpegkit.sh
                abiFilters "arm64-v8a"
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            minifyEnabled false
        }

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    namespace 'com.caydey.ffshare'
}
dependencies {
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.5.0'
    // photo picker for photos and videos together (PickMultipleVisualMedia)
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.1'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.1'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.3'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    implementation(files('libs/ffmpeg-kit-next-8.1.1.aar'))
    implementation 'com.arthenica:smart-exception-java:0.2.1'

    implementation 'com.jakewharton.timber:timber:5.0.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}